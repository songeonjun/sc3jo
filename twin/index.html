<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주천면 디지털트윈</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/cesium@1.123.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<style>
:root{--glass:rgba(10,16,28,.78);--line:rgba(160,185,220,.18);--ink:#eef3fa;--mut:#9aabc4;--w:#ff4fa3;--s:#3ee6c1;--hub:#8d6bff;--water:#4db5ff;--alert:#ff4d5e;--warn:#ffc145}
*{box-sizing:border-box;min-width:0}html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--ink);font:15px/1.5 "Noto Sans KR",system-ui,sans-serif;word-break:keep-all}
#cz{position:fixed;inset:0}
.cesium-viewer-bottom{left:auto!important;right:8px;bottom:6px!important;opacity:.7}
.cesium-widget-credits{font-size:10px}
#rain{position:fixed;inset:0;pointer-events:none;z-index:2}
#vig{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(130% 100% at 50% 45%,transparent 60%,rgba(0,0,0,.35) 100%)}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2);box-shadow:0 8px 30px rgba(0,0,0,.25)}
#top{position:fixed;top:16px;left:16px;right:16px;display:flex;gap:12px;align-items:center;z-index:5;pointer-events:none}#top>*{pointer-events:auto}
#brand{padding:9px 16px}#brand b{font-size:17px;font-weight:900}#brand span{display:block;font-size:12px;color:var(--mut)}
#tabs{display:flex;padding:4px;gap:4px}
#tabs button{font:700 14px "Noto Sans KR";color:var(--mut);background:transparent;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;min-height:42px}
#tabs button[aria-pressed=true]{background:rgba(255,255,255,.14);color:var(--ink)}
button:focus-visible,select:focus-visible{outline:2px solid var(--s);outline-offset:2px}
#src{margin-left:auto;padding:8px 12px;font-size:12px;color:var(--mut)}
#panel{position:fixed;left:16px;top:84px;width:min(380px,calc(100vw - 32px));max-height:calc(100vh - 200px);z-index:5;overflow:hidden;display:flex}
#panel .in{padding:18px;overflow-y:auto;scrollbar-width:thin}
h1{font-size:23px;line-height:1.22;margin:0 0 6px;font-weight:900;text-wrap:balance}
.lede{color:#c3d0e3;margin:0 0 12px;font-size:14px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px;align-items:center}.seg span{font-size:12px;color:var(--mut)}
.seg button{font:600 13px "Noto Sans KR";color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:9px;padding:7px 11px;cursor:pointer;min-height:36px}
.seg button[aria-pressed=true]{background:var(--ink);color:#0a1220;border-color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}
.kpi{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:rgba(255,255,255,.03)}
.kpi b{display:block;font-size:26px;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}.kpi small{font-size:14px;color:var(--mut);font-weight:500}
.kpi span{font-size:12px;color:var(--mut)}.kpi.warn b{color:var(--warn)}.kpi.alert b{color:var(--alert)}
.fig{position:relative;height:140px;margin:4px 0 6px}.fig svg{position:absolute;inset:0;width:100%;height:100%}
.log{list-style:none;margin:4px 0 0;padding:0;font-size:13px}.log li{display:grid;grid-template-columns:3.3em 1fr;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.log time{font-family:"IBM Plex Mono",monospace;color:var(--mut)}.log li.alert span{color:#ffb3bc}.log li.warn span{color:#ffe1a1}
.note{font-size:12px;color:var(--mut);margin:8px 0 0}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:5;display:flex;align-items:center;gap:14px;padding:12px 16px;width:min(980px,calc(100vw - 32px))}
#rot{display:flex;gap:4px;flex:none}#rot button{font:700 14px "Noto Sans KR";color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:9px;min-width:38px;min-height:38px;padding:0 10px;cursor:pointer}#rot button[aria-pressed=true]{background:var(--ink);color:#0a1220}
#play{font:900 14px "Noto Sans KR";background:var(--ink);color:#0a1220;border:0;border-radius:10px;min-width:76px;min-height:44px;cursor:pointer}
#clock{font:500 30px "IBM Plex Mono",monospace;min-width:4.4ch}
#tr{flex:1;accent-color:var(--s)}
#spd,#q{font:600 13px "Noto Sans KR";background:rgba(255,255,255,.08);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
#spd option{color:#000}
#legend{position:fixed;right:16px;bottom:96px;z-index:5;padding:10px 12px;font-size:12px;display:grid;gap:5px;max-width:250px}
#legend div{display:flex;gap:8px;align-items:center}#legend i{width:18px;height:4px;border-radius:2px;flex:none}#legend i.dot{width:10px;height:10px;border-radius:50%}
#toast{position:fixed;top:84px;right:16px;z-index:6;display:grid;gap:8px;width:min(340px,calc(100vw - 32px))}
.toast{padding:10px 12px;border-left:4px solid var(--warn);font-size:13.5px;animation:tin .35s ease}.toast.alert{border-left-color:var(--alert)}.toast.info{border-left-color:var(--s)}.toast b{display:block;font-size:12px;color:var(--mut);font-weight:500}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
#tip{position:fixed;z-index:9;pointer-events:none;display:none;padding:8px 10px;font-size:13px;max-width:280px}
#load{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#05080f;transition:opacity .8s}
#load div{text-align:center}#load b{font-size:22px;font-weight:900;display:block;margin-bottom:6px}#load span{color:var(--mut);font-size:14px}
#load .bar{width:260px;height:3px;background:rgba(255,255,255,.12);border-radius:2px;margin:16px auto 0;overflow:hidden}#load .bar i{display:block;height:100%;width:0;background:var(--s);transition:width .4s}
@media(prefers-reduced-motion:reduce){.toast{animation:none}}
@media(max-width:900px){#panel{top:auto;bottom:100px;max-height:40vh}#legend,#src{display:none}}
#keybox{position:fixed;top:76px;right:18px;z-index:9;width:340px;padding:16px;display:grid;gap:8px;font-size:13px}#keybox[hidden]{display:none}#keybox p{margin:0;color:var(--mut)}#keybox input{font:14px monospace;padding:9px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--ink)}#keybox div{display:flex;gap:6px}#keybox button{font:600 13px "Noto Sans KR";padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.1);color:var(--ink);cursor:pointer}
</style>
</head>
<body>
<div id="cz"></div><div id="vig"></div><canvas id="rain"></canvas>
<div id="load"><div><b>주천면 디지털트윈</b><span id="loadmsg">정밀 지형과 항공사진을 불러오는 중…</span><div class="bar"><i id="loadbar"></i></div></div></div>
<header id="top">
  <div id="brand" class="glass"><b>주천면 디지털트윈</b><span>강원특별자치도 영월군 주천면 · 실데이터 시뮬레이션</span></div>
  <nav id="tabs" class="glass" aria-label="장면"><button data-s="intro">한눈에 보기</button><button data-s="drt">DRT 하루 운행</button><button data-s="flood">집중호우 · 침수</button></nav>
  <div id="src" class="glass"></div>
</header>
<aside id="panel" class="glass"><div class="in" id="pin"></div></aside>
<div id="toast" aria-live="polite"></div>
<div id="bar" class="glass">
  <button id="play">재생</button><span id="clock">06:30</span>
  <input id="tr" type="range" min="0" max="1" step="60" value="0" aria-label="시뮬레이션 시각">
  <div id="rot" role="group" aria-label="화면 회전"><button id="rl" title="왼쪽으로 회전 (Q)">⟲</button><button id="ra" title="자동 회전 (R)" aria-pressed="false">자동 회전</button><button id="rr" title="오른쪽으로 회전 (E)">⟳</button><button id="rn" title="북쪽 위로 (N)">N</button><button id="hq" title="고화질 지형 토큰 입력">고화질</button></div>
  <select id="q" aria-label="그래픽 화질" title="그래픽 화질"><option value="max">화질 최고</option><option value="bal">화질 균형</option><option value="perf">화질 성능</option></select>
  <select id="spd" aria-label="재생 속도"><option value="0.5">느리게</option><option value="1" selected>보통</option><option value="2.5">빠르게</option></select>
</div>
<div id="legend" class="glass"></div>
<div id="tip" class="glass"></div>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="models.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.123.0/Build/Cesium/Cesium.js"></script>
<script src="app.js"></script>
<div id="keybox" class="glass" hidden><b>고화질 지형·항공사진</b><p>Cesium ion 토큰을 넣으면 Cesium World Terrain과 Bing 항공사진으로 바뀐다. 이 브라우저에만 저장된다.</p><input id="kIon" placeholder="Cesium ion 토큰" autocomplete="off"><input id="kVw" placeholder="브이월드 API 키 (선택)" autocomplete="off"><div><button id="kSave">저장하고 다시 열기</button><button id="kClr">지우기</button><button id="kX">닫기</button></div></div>
<script>{const b=document.getElementById('keybox'),s=document.getElementById('src');s.style.cursor='pointer';s.title='눌러서 고화질 지형 토큰 입력';const open=()=>{b.hidden=!b.hidden;try{kIon.value=localStorage.getItem('jc_ionToken')||'';kVw.value=localStorage.getItem('jc_vworldKey')||''}catch(e){}};s.addEventListener('click',open);document.getElementById('hq').addEventListener('click',open);kX.onclick=()=>b.hidden=true;kSave.onclick=()=>{try{localStorage.setItem('jc_ionToken',kIon.value.trim());localStorage.setItem('jc_vworldKey',kVw.value.trim())}catch(e){}location.reload()};kClr.onclick=()=>{try{localStorage.removeItem('jc_ionToken');localStorage.removeItem('jc_vworldKey')}catch(e){}location.reload()}}</script>
</body>
</html>
