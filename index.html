<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>스마트 산솔 3D · 스마트하조</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;600;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: full-bleed 3D map; floating control rail (left), top status bar, inspector card (right), legend strip (bottom). Dark command-room look, single theme by choice. */
:root{
  --bg:#0d1420; --panel:rgba(14,22,36,.9); --panel-solid:#111b2b; --line:#24344d;
  --fg:#e6edf7; --muted:#8a9ab3; --accent:#3fd5a0; --amber:#ffbe45; --cyan:#4cc9ff; --violet:#b48cff; --rose:#ff6b7d;
  --f-display:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);overflow:hidden}
#app{position:fixed;inset:0}
#gl{position:absolute;inset:0;display:block;width:100%;height:100%;outline:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:rgba(10,16,28,.78);border:1px solid var(--line);color:var(--fg)}
.lbl.v{background:transparent;border:none;font-size:13px;font-weight:800;text-shadow:0 1px 3px #000,0 0 8px #000;color:#f2f6ff}
.lbl.k{border-color:var(--amber);color:var(--amber)}
.lbl.s{border-color:var(--accent);color:var(--accent)}
.top{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap;pointer-events:none}
.top > *{pointer-events:auto;flex:none}
.brand{display:flex;align-items:baseline;gap:10px;padding:8px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.brand b{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:.02em}
.brand span{font-size:12px;color:var(--muted)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{font:600 13px var(--f-body);color:var(--muted);background:transparent;border:0;border-radius:8px;padding:7px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:#1d2c44;color:var(--fg)}
.seg button.after[aria-pressed="true"]{background:var(--accent);color:#06261b}
.seg button:focus-visible,.rail button:focus-visible,.chip:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.clock{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;font-size:12px;color:var(--muted)}
.clock output{font-family:var(--f-mono);color:var(--fg);min-width:44px}
.clock input{width:120px;accent-color:var(--amber)}
.rail{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:120px;display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;max-height:calc(100% - 200px);overflow:auto}
.rail h3{font-size:11px;letter-spacing:.12em;color:var(--muted);margin:4px 6px 2px;font-weight:600}
.rail button{display:flex;align-items:center;gap:8px;font:600 13px var(--f-body);color:var(--fg);background:transparent;border:1px solid transparent;border-radius:9px;padding:7px 10px;cursor:pointer;text-align:left}
.rail button .dot{width:10px;height:10px;border-radius:3px;flex:none}
.rail button[aria-pressed="false"]{color:var(--muted)}
.rail button[aria-pressed="false"] .dot{opacity:.25}
.rail button:hover{border-color:var(--line)}
.side{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:120px;width:300px;max-height:calc(100% - 200px);overflow:auto;display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card h2{font:800 15px var(--f-display);margin:0 0 4px}
.card .sub{font-size:12px;color:var(--muted);margin:0 0 10px;line-height:1.5}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.delta{color:var(--accent)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid currentColor;margin-right:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 12px var(--f-body);color:var(--fg);background:#16233a;border:1px solid var(--line);border-radius:999px;padding:6px 10px;cursor:pointer}
.chip:hover{border-color:var(--cyan)}
.foot{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;pointer-events:none}
.foot > *{pointer-events:auto}
.legend{display:flex;flex-wrap:wrap;gap:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}
.credit{font-size:11px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;align-self:flex-end}
.credit a{color:var(--cyan)}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);font-size:14px;color:var(--muted);z-index:5}
.hint{font-size:12px;color:var(--muted);line-height:1.6}
.devbtn{font:600 13px var(--f-body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 14px;cursor:pointer}
.devbtn.on{border-color:var(--violet);color:var(--violet)}
.devbtn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.pv{font-size:12px;font-weight:600;color:#1b1030;background:var(--violet);border-radius:999px;padding:6px 10px}
.dev{border-color:var(--violet)}
.devhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);margin-bottom:8px}
.fld input,.fld select,.fld textarea{font:13px var(--f-body);color:var(--fg);background:#0e1828;border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;box-sizing:border-box}
.fld textarea{resize:vertical}
.row{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin:6px 0}
.chip.primary{background:var(--violet);color:#1b1030;border-color:var(--violet)}
.chip:disabled{opacity:.45;cursor:default}
.status{font-size:12px;line-height:1.55;color:var(--fg);background:#18243a;border-radius:8px;padding:8px 10px;margin:6px 0}
.diff{font-size:12px;display:flex;flex-direction:column;gap:4px;margin:6px 0;color:var(--muted)}
.diff b{color:var(--fg)}
.diff code{font-family:var(--f-mono);color:var(--accent);word-break:break-all}
details{font-size:12px;color:var(--muted);margin:6px 0}
summary{cursor:pointer;color:var(--fg);margin-bottom:8px}
@media (max-width:820px){
  .rail{top:auto;bottom:70px;flex-direction:row;flex-wrap:wrap;max-height:none;right:max(16px,env(safe-area-inset-right,0px))}
  .rail h3{display:none}
  .side{top:auto;bottom:170px;width:auto;left:max(16px,env(safe-area-inset-left,0px));max-height:30%}
  .legend{display:none}
  .clock input{width:80px}
}
.tour{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));width:min(680px,calc(100% - 32px));background:rgba(10,16,28,.94);border:1px solid var(--line);border-radius:16px;padding:16px 18px 12px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.tour .step{font:500 11px var(--f-mono,monospace);color:var(--accent);letter-spacing:.06em}
.tour h2{margin:4px 0 6px;font-size:20px;line-height:1.3}
.tour p{margin:0;color:var(--fg);font-size:14px;line-height:1.6}
.tour .src{margin-top:6px;font-size:11px;color:var(--muted)}
.tour .ctl{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:12px}
.tour .bar{flex:1;height:3px;background:#1e2b40;border-radius:2px;overflow:hidden}.tour .bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.tourbtn{pointer-events:auto;font:700 13px var(--f-body);color:#08131f;background:var(--accent);border:0;border-radius:12px;padding:10px 14px;cursor:pointer}
#app.touring .side,#app.touring .rail{display:none}
.facts{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.facts li{display:grid;grid-template-columns:76px 1fr;gap:8px;align-items:baseline;font-size:12.5px;color:var(--muted)}
.facts b{font:600 16px var(--f-mono,monospace);color:var(--fg)}
@media (max-width:820px){.tour{bottom:calc(150px + env(safe-area-inset-bottom,0px))}.tour h2{font-size:17px}}
.rvpop{position:absolute;left:50%;transform:translateX(-50%);top:calc(150px + env(safe-area-inset-top,0px));z-index:30;pointer-events:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 32px);background:rgba(10,16,28,.95);border:1px solid var(--accent);border-radius:14px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.45)}.rvpop b{font-size:13px}.rvpop a{font:700 13px var(--f-body);color:#08131f;background:var(--accent);border-radius:10px;padding:8px 12px;text-decoration:none}.rvpop a.nv{background:#4cc9ff}.rvpop button{background:none;border:0;color:var(--muted);font-size:16px;cursor:pointer;padding:4px 6px}
.rv{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 0}.rv a{pointer-events:auto;font:700 12.5px var(--f-body);color:#08131f;background:var(--accent);border-radius:10px;padding:7px 11px;text-decoration:none}.rv a+a{background:#4cc9ff}.rv span{font:11px var(--f-mono,monospace);color:var(--muted)}
.rvbox{width:100%;height:min(46vh,380px);border-radius:12px;overflow:hidden;margin-top:8px;background:#0b1424}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function stepFleet(m,dt,count){ const it=m.userData.items; const n=count??it.length; for(let i=0;i<n;i++){ const v=it[i]; const L=v.cum[v.cum.length-1]||1; v.t+=v.dir*v.speed*dt/L; if(v.t>1){v.t=1;v.dir=-1;} if(v.t<0){v.t=0;v.dir=1;} const [x,z,a]=along(v.p,v.cum,v.t*L); const side=v.dir>0?1:-1; dummy.position.set(x+(-Math.sin(a))*1.6*side,0.2,z+Math.cos(a)*1.6*side); dummy.rotation.set(0,-a,0); dummy.updateMatrix(); m.setMatrixAt(i,dummy.matrix);} m.count=n; m.instanceMatrix.needsUpdate=true; }

    <div class="ctl"><button class="chip" disabled=${tour===0} onClick=${()=>go(tour-1)}>◀ 이전</button><div class="bar"><i style=${{width:((tour+1)/TOUR.length*100)+'%'}}></i></div><button class="chip" aria-pressed=${auto} onClick=${()=>setAuto(a=>!a)}>${auto?'자동 ❚❚':'자동 ▶'}</button><button class="chip primary" onClick=${()=>tour<TOUR.length-1?go(tour+1):(setTour(-1),setAuto(false))}>${tour<TOUR.length-1?'다음 ▶':'끝내기'}</button></div>
  </section>`:null}
  ${ask&&pick&&pick.road&&tour<0?html`<div class="rvpop" role="dialog" aria-label="로드뷰 보기"><b>📍 ${pick.road} — 이 도로의 로드뷰를 볼까요?</b><a href="#" onClick=${e=>{ e.preventDefault(); setRv({lat:pick.lat,lon:pick.lon,name:pick.name}); setAsk(false); }}>예</a><a class="nv" href="#" onClick=${e=>{ e.preventDefault(); setAsk(false); }}>아니오</a></div>`:null}
  <div class="foot">
    <div class="legend">
      <span><i style=${{background:'#8d97a8'}}></i>간선·지방도</span><span><i style=${{background:'#9a7b52'}}></i>농로</span><span><i style=${{background:'#3d86b8'}}></i>하천·저수지</span><span><i style=${{background:'#4cc9ff'}}></i>버스 노선</span><span><i style=${{background:A?'#b48cff':'#ff5a5a'}}></i>${A?'사각지대 → AI 영상 보강':'CCTV 사각지대'}</span>${A?html`<span><i style=${{background:'#b48cff'}}></i>DRT</span><span><i style=${{background:'#ffbe45'}}></i>농산물 경로</span><span><i style=${{background:'#3fd5a0'}}></i>스마트팜</span>`:null}
    </div>
    <div class="credit">지도 데이터 © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> 기여자 · 경로당·주요시설 위치: 카카오맵 · 인구: 행정안전부(2026.10.) · 버스: 영월군 대중교통정보 · 보안등·CCTV·주택·농지 필지·스마트팜 배치는 개념 추정</div>
  </div>`; }
ReactDOM.createRoot(document.getElementById('ui')).render(html`<${App}/>`);
})();
